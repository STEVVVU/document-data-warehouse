[project]
name = "document-data-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
description = "Document extraction and provenance-aware purchase warehouse"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "target", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
